version: '3.8'

services:
  gym-tracker-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gym-tracker-server
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - HOST=0.0.0.0
      - JWT_SECRET=change_this_to_your_secure_random_string_2026
      - DATA_DIR=/app/data
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    deploy:
      resources:
        limits:
          memory: 256M
